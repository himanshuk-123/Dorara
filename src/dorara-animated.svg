<svg width="400" height="400" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="220" height="220" fill="#0A1114" rx="20"/>

  <!-- Outer hexagon border with draw animation -->
  <polygon points="110,12 198,60 198,160 110,208 22,160 22,60"
    fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.4"
    stroke-dasharray="480" stroke-dashoffset="480">
    <animate attributeName="stroke-dashoffset" from="480" to="0" dur="2s" fill="freeze" begin="0s"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite" begin="2s"/>
  </polygon>

  <!-- Inner hexagon -->
  <polygon points="110,30 182,72 182,148 110,190 38,148 38,72"
    fill="rgba(10,17,20,0.9)" stroke="url(#grad1)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.5s" fill="freeze" begin="1.5s"/>
  </polygon>

  <!-- D shape outline draw animation -->
  <path d="M68 52 L105 52 Q155 52 155 110 Q155 168 105 168 L68 168 Z"
    fill="rgba(16,185,129,0.06)" stroke="url(#grad1)" stroke-width="2.5"
    filter="url(#glow)" stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" from="320" to="0" dur="1.5s" fill="freeze" begin="0.5s"/>
  </path>

  <!-- Vertical spine of D -->
  <line x1="68" y1="52" x2="68" y2="168" stroke="url(#grad1)" stroke-width="3.5" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2s"/>
  </line>

  <!-- Horizontal circuit lines (staggered appear) -->
  <line x1="68" y1="80" x2="140" y2="80" stroke="#10B981" stroke-width="0.8" opacity="0"
    stroke-dasharray="80" stroke-dashoffset="80">
    <animate attributeName="stroke-dashoffset" from="80" to="0" dur="0.6s" fill="freeze" begin="2.2s"/>
    <animate attributeName="opacity" from="0" to="0.35" dur="0.3s" fill="freeze" begin="2.2s"/>
  </line>
  <line x1="68" y1="95" x2="148" y2="95" stroke="#10B981" stroke-width="0.8" opacity="0"
    stroke-dasharray="88" stroke-dashoffset="88">
    <animate attributeName="stroke-dashoffset" from="88" to="0" dur="0.6s" fill="freeze" begin="2.4s"/>
    <animate attributeName="opacity" from="0" to="0.35" dur="0.3s" fill="freeze" begin="2.4s"/>
  </line>
  <line x1="68" y1="110" x2="155" y2="110" stroke="#10B981" stroke-width="1.5" opacity="0"
    stroke-dasharray="90" stroke-dashoffset="90">
    <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.6s" fill="freeze" begin="2.6s"/>
    <animate attributeName="opacity" from="0" to="0.6" dur="0.3s" fill="freeze" begin="2.6s"/>
  </line>
  <line x1="68" y1="125" x2="148" y2="125" stroke="#10B981" stroke-width="0.8" opacity="0"
    stroke-dasharray="88" stroke-dashoffset="88">
    <animate attributeName="stroke-dashoffset" from="88" to="0" dur="0.6s" fill="freeze" begin="2.8s"/>
    <animate attributeName="opacity" from="0" to="0.35" dur="0.3s" fill="freeze" begin="2.8s"/>
  </line>
  <line x1="68" y1="140" x2="140" y2="140" stroke="#10B981" stroke-width="0.8" opacity="0"
    stroke-dasharray="80" stroke-dashoffset="80">
    <animate attributeName="stroke-dashoffset" from="80" to="0" dur="0.6s" fill="freeze" begin="3.0s"/>
    <animate attributeName="opacity" from="0" to="0.35" dur="0.3s" fill="freeze" begin="3.0s"/>
  </line>

  <!-- Circuit dots on lines (blinking after appear) -->
  <circle cx="110" cy="80" r="2.5" fill="#10B981" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.8s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" begin="3.5s"/>
  </circle>
  <circle cx="125" cy="95" r="2.5" fill="#14B8A6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.9s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" begin="3.7s"/>
  </circle>
  <circle cx="130" cy="110" r="3.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.0s"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="3.5s"/>
    <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite" begin="3.5s"/>
  </circle>
  <circle cx="125" cy="125" r="2.5" fill="#14B8A6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.1s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" begin="3.9s"/>
  </circle>
  <circle cx="110" cy="140" r="2.5" fill="#10B981" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" begin="4.1s"/>
  </circle>

  <!-- Spine node dots -->
  <circle cx="68" cy="52" r="4.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <circle cx="68" cy="110" r="4" fill="#14B8A6" filter="url(#glow2)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.2s"/>
    <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <circle cx="68" cy="168" r="4.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- Corner hexagon dots blinking -->
  <circle cx="110" cy="12" r="3.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <circle cx="198" cy="60" r="3.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="2.9s"/>
  </circle>
  <circle cx="198" cy="160" r="3.5" fill="#14B8A6" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="3.3s"/>
  </circle>
  <circle cx="110" cy="208" r="3.5" fill="#14B8A6" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="3.7s"/>
  </circle>
  <circle cx="22" cy="160" r="3.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="4.1s"/>
  </circle>
  <circle cx="22" cy="60" r="3.5" fill="#10B981" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" begin="4.5s"/>
  </circle>

  <!-- Scan line animation (infinite loop) -->
  <clipPath id="dClip">
    <path d="M62 48 L108 48 Q160 48 160 110 Q160 172 108 172 L62 172 Z"/>
  </clipPath>
  <rect x="40" y="0" width="140" height="2" fill="url(#grad1)" opacity="0.7" clip-path="url(#dClip)">
    <animateTransform attributeName="transform" type="translate"
      values="0,52; 0,168; 0,52" dur="2.5s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="2.5s" repeatCount="indefinite" begin="4s"/>
  </rect>

</svg>
